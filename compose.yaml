x-airflow-image: &airflow-image
  image: project18-airflow
  build:
    context: .
    dockerfile: airflow.Dockerfile

services:
  postgres:
    image: project18-postgres
    build:
      context: .
      dockerfile: Dockerfile
    command: ["postgres", "-c", "timezone=Europe/Tallinn"]
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./queries:/queries:ro
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: elestio/pgadmin:REL-8_10
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  mongodb:
    container_name: mongodb
    image: mongo:8.0.34
    env_file:
      - .env
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --quiet --eval 'db.adminCommand(\"ping\").ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ridango-poller:
    image: project18-ridango-poller
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "/app/src/poll_ridango.py"]
    environment:
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-project18}:${MONGO_INITDB_ROOT_PASSWORD:-project18}@mongodb:27017/?authSource=admin
      MONGO_DATABASE: ${MONGO_DATABASE:-tartu_bus}
      MONGO_COLLECTION: ${MONGO_COLLECTION:-ridango_poll_events}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-15}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  ridango-cleaner:
    image: project18-ridango-cleaner
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "/app/src/clean_ridango.py"]
    environment:
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-project18}:${MONGO_INITDB_ROOT_PASSWORD:-project18}@mongodb:27017/?authSource=admin
      MONGO_DATABASE: ${MONGO_DATABASE:-tartu_bus}
      MONGO_COLLECTION: ${MONGO_COLLECTION:-ridango_poll_events}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-project18}
      POSTGRES_USER: ${POSTGRES_USER:-project18}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-project18}
      CLEANER_INTERVAL_SECONDS: ${CLEANER_INTERVAL_SECONDS:-10}
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mongo-express:
    image: mongo-express:1.0.2
    ports:
      - "${MONGO_EXPRESS_PORT:-8082}:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-project18}:${MONGO_INITDB_ROOT_PASSWORD:-project18}@mongodb:27017/?authSource=admin
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-pass}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  airflow-db:
    container_name: airflow-db
    image: postgres:16.4
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
      PGUSER: ${AIRFLOW_DB_USER:-airflow}
      PGPASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      PGDATABASE: ${AIRFLOW_DB_NAME:-airflow}
    ports:
      - "${AIRFLOW_DB_PORT:-5432}:5432"
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      retries: 5
    restart: always

  airflow-webserver:
    <<: *airflow-image
    container_name: airflow-webserver
    command: webserver
    user: "50000:0"
    environment:
      &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-db:5432/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
      GTFS_DB_HOST: postgres
      GTFS_DB_PORT: 5432
      GTFS_DB_NAME: ${POSTGRES_DB:-project18}
      GTFS_DB_USER: ${POSTGRES_USER:-project18}
      GTFS_DB_PASSWORD: ${POSTGRES_PASSWORD:-project18}
      MONGO_DATABASE: ${MONGO_DATABASE:-tartu_bus}
      MONGO_COLLECTION: ${MONGO_COLLECTION:-ridango_poll_events}
      AIRFLOW_CONN_RIDANGO_MONGO: >-
        {"conn_type":"generic","host":"mongodb","port":27017,"login":"${MONGO_INITDB_ROOT_USERNAME:-project18}","password":"${MONGO_INITDB_ROOT_PASSWORD:-project18}","extra":{"authSource":"admin"}}
      AIRFLOW_CONN_WAREHOUSE_POSTGRES: >-
        {"conn_type":"postgres","host":"postgres","port":5432,"login":"${POSTGRES_USER:-project18}","password":"${POSTGRES_PASSWORD:-project18}","schema":"${POSTGRES_DB:-project18}"}
    ports:
      - "${AIRFLOW_WEB_PORT:-8080}:8080"
    volumes:
      &airflow-common-volumes
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data:ro
      - ./logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-db:
        condition: service_healthy
    restart: always

  airflow-scheduler:
    <<: *airflow-image
    container_name: airflow-scheduler
    command: scheduler
    user: "50000:0"
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-db:
        condition: service_healthy
    restart: always
    
  airflow-init:
    <<: *airflow-image
    container_name: airflow-init
    entrypoint: /bin/bash
    user: "0:0"
    command:
      - -c
      - |
        set -e
        mkdir -p /opt/airflow/logs /opt/airflow/dags
        chown -R 50000:0 /opt/airflow/logs /opt/airflow/dags
        exec runuser -u airflow -- bash -euc "
          airflow db migrate
          airflow users create \
            --username ${AIRFLOW_ADMIN_USER:-airflow} \
            --password ${AIRFLOW_ADMIN_PASSWORD:-airflow} \
            --firstname Admin --lastname User \
            --role Admin --email ${AIRFLOW_ADMIN_EMAIL:-admin@example.com} || true
          # FileSensor needs an fs connection. It normally ships as an example
          # connection, but LOAD_EXAMPLES is off, so create it explicitly.
          airflow connections delete fs_default 2>/dev/null || true
          airflow connections add fs_default --conn-uri file:///
        "
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    depends_on:
      airflow-db:
        condition: service_healthy
    restart: "no"

  dbt:
    image: project18-dbt
    build:
      context: .
      dockerfile: dbt.Dockerfile
    container_name: project18-dbt
    volumes:
      - ./dbt:/dbt
    environment:
      DBT_PROJECT_DIR: /dbt
      DBT_PROFILES_DIR: /dbt
      POSTGRES_USER: ${POSTGRES_USER:-project18}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-project18}
      POSTGRES_DB: ${POSTGRES_DB:-project18}
    depends_on:
      postgres:
        condition: service_healthy
    tty: true
    stdin_open: true
    restart: always 

volumes:
  postgres_data:
  pgadmin_data:
  mongodb_data:
  airflow_db_data:
