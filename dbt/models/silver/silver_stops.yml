version: 2

models:
  - name: silver_stops
    description: "Active Tartu stops and other active stops referenced by the current timetable."
    columns:
      - name: file_version
        tests:
          - not_null
      - name: stop_id
        description: "Unique stop identifier."
        tests:
          - unique
          - not_null
      - name: stop_name
        tests:
          - not_null
      - name: stop_lat
        tests:
          - not_null
      - name: stop_lon
        tests:
          - not_null
      - name: stop_area
        tests:
          - not_null
