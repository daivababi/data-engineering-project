version: 2

models:
  - name: fact_stop_arrival
    description: >
      Gold scheduled-arrival fact at one row per service date, trip, and stop
      sequence. Uses the legacy DDL table name. This timetable-only model does
      not contain actual-arrival or delay fields because those observations
      have not been ingested. HH:MM preserves GTFS hours beyond 24 (for example,
      25:10).
    columns:
      - name: arrival_key
        description: "Deterministic key for a scheduled service-date trip stop."
        tests:
          - unique
          - not_null
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: stop_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_stop')
              field: stop_key
      - name: trip_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_trip')
              field: trip_key
      - name: service_date
        description: "Date on which the GTFS service starts."
        tests:
          - not_null
      - name: service_id
        tests:
          - not_null
      - name: trip_id
        tests:
          - not_null
      - name: route_id
        tests:
          - not_null
      - name: stop_id
        tests:
          - not_null
      - name: stop_sequence
        tests:
          - not_null
      - name: scheduled_arrival
        description: "Full scheduled timestamp, useful for sorting across midnight."
        tests:
          - not_null
      - name: scheduled_arrival_hhmm
        description: "Scheduled GTFS arrival formatted as HH:MM, retaining hours over 24."
        tests:
          - not_null
