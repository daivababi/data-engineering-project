version: 2

models:
  - name: dim_date
    description: "Gold date dimension containing dates with active GTFS service."
    columns:
      - name: date_key
        description: "Integer date key in YYYYMMDD format."
        tests:
          - unique
          - not_null
      - name: full_date
        tests:
          - unique
          - not_null
      - name: day_of_week
        tests:
          - not_null
          - accepted_values:
              values: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
