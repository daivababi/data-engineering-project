version: 2

sources:
  - name: bronze
    schema: bronze
    tables:
      - name: raw_stops
        description: "Raw GTFS bus stops loaded from data/raw/stops.txt"
        columns:
          - name: stop_id
            tests:
              - unique
              - not_null
          - name: stop_name
            tests:
              - not_null
      - name: raw_agency
      - name: raw_calendar
      - name: raw_calendar_attributes
      - name: raw_calendar_dates
      - name: raw_directions
      - name: raw_feed_info
      - name: raw_route_attributes
      - name: raw_routes
      - name: raw_shapes
      - name: raw_stop_times
      - name: raw_trips
      - name: raw_ridango_poll_events
        description: "Raw MongoDB poll documents copied from the Ridango vehicle-status poller."
        columns:
          - name: mongo_id
            tests:
              - unique
              - not_null
          - name: poll_id
            tests:
              - unique
              - not_null
          - name: status
            tests:
              - not_null
